name: Deploy to Nginx

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Copy files to Nginx
        shell: powershell
        run: |
          Copy-Item -Path todo.html,todo.css,todo.js -Destination "C:\nginx-1.30.4\html\todo" -Force